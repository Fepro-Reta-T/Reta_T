name: Backend tests

on:
  pull_request:
    paths:
      - "backend/api/**"
  push:
    branches: [main]
    paths:
      - "backend/api/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/api/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Correr tests
        env:
          DATABASE_URL: "postgresql+asyncpg://user:pass@localhost:5432/db"
          JWT_SECRET_KEY: "ci-test-secret-key-no-usar-en-produccion-32"
        run: pytest -v
